name: Build Mis tareas 2.2 APK

on:
  push:
    branches: [ "pendientes-ia-build" ]
    paths:
      - "android-build/mt22-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat android-build/mt22_00.txt android-build/mt22_01.txt android-build/mt22_02.txt android-build/mt22_03.txt android-build/mt22_04.txt android-build/mt22_05.txt android-build/mt22_06.txt android-build/mt22_07.txt android-build/mt22_08.txt android-build/mt22_09.txt | base64 -d > mis-tareas-2.2-source.zip
          echo "c4d740788501463123af2fe9981b45be261924f6b9be3d8d66e48e4288782f93  mis-tareas-2.2-source.zip" | sha256sum -c -
          unzip -t mis-tareas-2.2-source.zip
          unzip -q mis-tareas-2.2-source.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build unsigned release APK
        working-directory: pendientes_v20_build
        run: gradle --no-daemon assembleRelease

      - name: Verify APK exists
        shell: bash
        run: |
          test -f pendientes_v20_build/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh pendientes_v20_build/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Mis-tareas-2.2-unsigned
          path: pendientes_v20_build/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
